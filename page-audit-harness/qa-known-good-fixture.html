<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Known-Good QA Self-Test Fixture</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#0b0f14; color:#e8edf2; }
  header { padding:16px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:#c7d0da; line-height:1.5; max-width:100%; }
  .btn { display:inline-block; min-height:44px; min-width:44px; padding:12px 20px;
         background:#3b82f6; color:#fff; border:none; border-radius:8px; font-size:16px; }
  main { padding:0 16px 32px; max-width:100%; overflow-x:hidden; }
  img, canvas { max-width:100%; }
</style>
</head>
<body>
<header><h1>Known-good fixture</h1></header>
<main>
  <p>This fixture has a title, 4.5:1+ contrast text, a 44px+ touch target, and no horizontal overflow.</p>
  <button class="btn" type="button">Tap target</button>
</main>
</body>
</html>
